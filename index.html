<!doctype html>
<html lang="vi" data-skin="daylight" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070707" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RAI²" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>RAI² | ARTIFICIAL INTELLIGENCE + ACTUAL INTELLIGENCE</title>
    <link rel="preload" href="/assets/rai-core-white.png?v=7" as="image" />
  </head>
  <body style="margin:0;background:#070707;color:#f3f4f6;">
    <div id="root">
      <div style="position:fixed;inset:0;background:#070707;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:24px;">
          <img src="/assets/rai-core-white.png?v=7" alt="RAI²" style="height:44px;width:auto;object-fit:contain;" />
        </div>
        <div style="width:130px;height:3px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;position:relative;">
          <div style="position:absolute;left:0;top:0;bottom:0;width:40%;background:#ff8833;border-radius:999px;animation:rai-bar 1.1s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes rai-bar {
            0% { left: -40%; width: 40%; }
            50% { left: 35%; width: 50%; }
            100% { left: 100%; width: 40%; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
